name: samafox
description: A modern social voice chat application built with Flutter
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_sound: ^9.2.13  # Has built-in AEC


  #flutter_webrtc: ^0.9.48
  flutter_webrtc: ^1.2.1

  flutter_staggered_grid_view: ^0.7.0

  flutter_facebook_auth: ^6.0.4


  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.10

  # Navigation
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  pretty_dio_logger: ^1.3.1

  # Real-time Communication
  socket_io_client: ^2.0.3+1
  # flutter_webrtc: ^0.11.7  # Commented - add later


  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  # Authentication
  google_sign_in: ^6.2.2
  # flutter_facebook_auth: ^7.1.1  # Commented - add later

  # Permissions
  permission_handler: ^11.3.1

  # Device Info
  device_info_plus: ^9.1.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.0.2+1
  uuid: ^4.3.3

  # Image Picker
  image_picker: ^1.0.7

  share_plus: ^7.0.0

  # URL Launcher
  url_launcher: ^6.2.4
  smooth_page_indicator: ^1.1.0
  confetti: ^0.7.0
  audioplayers: ^5.2.1
  audio_session: ^0.1.18
  video_player: ^2.8.2
  # Country Picker
  country_picker: ^2.0.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/frames/gold_wings.png
    - assets/icons/
    - assets/mega/
    - assets/seat_effect.mp4
    - android/app/src/main/assets/adi-registration.properties
  fonts:
        - family: ElMessiri
          fonts:
            - asset: assets/fonts/ElMessiri-Regular.ttf
              weight: 700
