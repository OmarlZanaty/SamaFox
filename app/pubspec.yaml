name: samafox
description: A modern social voice chat application built with Flutter
publish_to: 'none'
# The build number must stay ABOVE whatever is live on Play. It was carried in
# android/local.properties as 2024 while this file said +24 — and `flutter run`
# regenerates local.properties FROM this file, so that override was silently
# overwritten and the next build would have dropped to 24 and been rejected as
# a downgrade. pubspec is the single source of truth now.
version: 1.0.23+2031

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_sound: ^9.2.13  # Has built-in AEC


  #flutter_webrtc: ^0.9.48
  flutter_webrtc: ^1.2.1
  livekit_client: ^2.6.2

  flutter_staggered_grid_view: ^0.7.0

  flutter_facebook_auth: ^6.0.4


  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.10

  # Navigation
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  pretty_dio_logger: ^1.3.1

  # Real-time Communication
  socket_io_client: ^2.0.3+1
  # flutter_webrtc: ^0.11.7  # Commented - add later


  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  # Authentication
  google_sign_in: ^6.2.2
  # flutter_facebook_auth: ^7.1.1  # Commented - add later

  # Permissions
  permission_handler: ^11.3.1

  # Device Info
  device_info_plus: ^12.4.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.0.2+1
  uuid: ^4.3.3

  # Image Picker
  image_picker: ^1.0.7
  # Referenced directly to turn the system photo picker on for every Android
  # version (Play policy — no READ_MEDIA_IMAGES). Same versions image_picker
  # already pulls in.
  image_picker_android: ^0.8.12
  image_picker_platform_interface: ^2.10.0
  image_cropper: ^8.0.2

  # Picks songs off the phone for room music (image_picker cannot do audio).
  # Must stay >=8: 6.x still ships the v1-embedding FilePickerPlugin.java, and
  # its PluginRegistry.Registrar was removed from Flutter — the release build
  # dies with "cannot find symbol: class Registrar".
  file_picker: ^10.0.0

  share_plus: ^7.0.0

  # A10 — "طول ما المستخدم داخل التطبيق الشاشة ما تفصلش تلقائي", independent of
  # the phone's own sleep setting. wakelock_plus is the maintained successor to
  # the discontinued `wakelock`.
  wakelock_plus: ^1.2.8

  # URL Launcher
  url_launcher: ^6.2.4
  # Reads this build's own version code for the forced-update gate.
  package_info_plus: ^9.0.1
  # Already present transitively; declared because CrashReporter uses it
  # directly to store the session marker that detects an OS kill.
  path_provider: ^2.1.5
  smooth_page_indicator: ^1.1.0
  confetti: ^0.7.0
  audioplayers: ^5.2.1
  audio_session: ^0.1.18
  video_player: ^2.8.2
  webview_flutter: ^4.7.0
  flutter_cache_manager: ^3.3.1
  # Country Picker
  country_picker: ^2.0.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Directory entries are NOT recursive, so the crash artwork needs its own
    # line even though it lives under assets/images/.
    - assets/images/cp/
    - assets/images/crash/
    # عجلة الحظ artwork — same non-recursive rule as the crash folder.
    - assets/images/crazy/
    # بلينكو artwork — likewise.
    - assets/images/plinko/
    # أثيرفول artwork — likewise.
    - assets/images/aetherfall/
    - assets/images/olympus/
    # Recorded spins for lib/dev/olympus_play.dart. ~50 KB, dev harness only.
    - assets/dev/
    - assets/images/neon/
    # القط الجشع artwork — likewise. The screen paints its own vector art, so
    # this folder is empty until the commissioned PNGs land; see
    # GREEDY_CAT_ARTWORK_BRIEF.md.
    - assets/images/greedy/
    # Game-card banners for the hub.
    - assets/images/cards/
    - assets/fonts/
    - assets/frames/gold_wings.png
    - assets/icons/
    - assets/mega/
    - assets/seat_effect.mp4
    - assets/sounds/
    - android/app/src/main/assets/adi-registration.properties
  # Bloom post-process for the crash game. Loaded at runtime with a fallback to
  # the plain blur stack if the device cannot compile it.
  shaders:
    - shaders/bloom.frag
  fonts:
        - family: ElMessiri
          fonts:
            - asset: assets/fonts/ElMessiri-Regular.ttf
              weight: 700

# livekit_client needs protobuf 6; retrofit_generator 8 (a DEV-only code
# generator whose output is already checked in) still declares protobuf 3. The
# newer retrofit_generator that would lift this is blocked by hive_generator via
# the analyzer. The override only affects the generator, never the app binary.
dependency_overrides:
  protobuf: ^6.0.0
