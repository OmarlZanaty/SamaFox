# Gradle daemon memory.
#
# This was -Xmx8G -XX:MaxMetaspaceSize=4G: 12 GB of reservations, which a 12 GB
# machine cannot satisfy. The daemon then fails to start outright with "Unable to
# start the daemon process", and builds only work when a daemon from an earlier
# session happens to still be alive. 3 GB heap plus 1 GB metaspace builds this
# project comfortably and leaves room for the Kotlin compiler and the Dart
# toolchain alongside it.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin compiles inside the Gradle daemon rather than spawning a second JVM.
# One less ~1 GB process during a build, at no cost to correctness.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.enableJetifier=true

# Known issue on this machine, left here as a note rather than a setting:
# when the pub cache and the project sit on different drives (pub cache on C:,
# project on D:), Kotlin's incremental compiler throws
#   IllegalArgumentException: this and base files have different roots
# from RelocatableFileToPathConverter, because Windows cannot express a relative
# path across drive letters. It kills :file_picker:compileDebugKotlin and any
# other plugin compiled from the cache. Two ways out:
#   * put both on the same drive — set PUB_CACHE to a folder on the project's
#     drive and run `flutter pub get` again (the real fix), or
#   * build with `-P kotlin.incremental=false` (slower rebuilds, no code change).
