<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <!-- Outer rim gold -->
        <radialGradient id="rimGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FFF3B0"/>
            <stop offset="35%" stop-color="#FFD86A"/>
            <stop offset="70%" stop-color="#F4B63D"/>
            <stop offset="100%" stop-color="#C9891A"/>
        </radialGradient>

        <!-- Inner face gold -->
        <radialGradient id="faceGrad" cx="30%" cy="25%" r="80%">
            <stop offset="0%" stop-color="#FFF7C7"/>
            <stop offset="40%" stop-color="#FFD56A"/>
            <stop offset="75%" stop-color="#E6A62E"/>
            <stop offset="100%" stop-color="#B67816"/>
        </radialGradient>

        <!-- Subtle edge shadow -->
        <radialGradient id="shadowGrad" cx="50%" cy="65%" r="70%">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
            <stop offset="60%" stop-color="#000000" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Gloss highlight -->
        <linearGradient id="glossGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
            <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>

        <!-- Emboss (dark) -->
        <linearGradient id="embossDark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8A5A0E" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#5E3A07" stop-opacity="0.95"/>
        </linearGradient>

        <!-- Emboss (light) -->
        <linearGradient id="embossLight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFF0B0" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#FFD56A" stop-opacity="0.95"/>
        </linearGradient>
    </defs>

    <!-- Drop shadow -->
    <circle cx="256" cy="274" r="198" fill="url(#shadowGrad)"/>

    <!-- Outer rim -->
    <circle cx="256" cy="256" r="200" fill="url(#rimGrad)"/>
    <circle cx="256" cy="256" r="184" fill="#000000" opacity="0.10"/>

    <!-- Coin face -->
    <circle cx="256" cy="256" r="176" fill="url(#faceGrad)"/>

    <!-- Rim grooves -->
    <g opacity="0.20">
        <path d="M256 72a184 184 0 0 1 0 368" stroke="#6B430B" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M256 72a184 184 0 0 0 0 368" stroke="#FFF2B8" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Inner ring -->
    <circle cx="256" cy="256" r="132" fill="none" stroke="#FFF2B8" stroke-opacity="0.40" stroke-width="10"/>
    <circle cx="256" cy="256" r="132" fill="none" stroke="#7A4B0C" stroke-opacity="0.20" stroke-width="10"/>

    <!-- Gloss highlight shape -->
    <path d="M145 155c38-54 106-86 175-80 28 2 52 10 72 22
           -48 6-96 33-128 70-27 31-44 68-47 111
           -25-18-49-43-72-80z"
        fill="url(#glossGrad)"/>

    <!-- Embossed EGP text (light + dark offset for 3D) -->
    <g font-family="Arial, 'Noto Naskh Arabic', 'Amiri', sans-serif" font-weight="800" text-anchor="middle">
        <!-- dark offset -->
        <text x="260" y="278" font-size="86" fill="url(#embossDark)">samafox</text>
        <!-- light top -->
        <text x="254" y="272" font-size="86" fill="url(#embossLight)">samafox</text>
    </g>

    <!-- Small sparkles -->
    <g opacity="0.55">
        <path d="M366 168l10 6-10 6-6 10-6-10-10-6 10-6 6-10z" fill="#FFFFFF"/>
        <path d="M165 318l8 5-8 5-5 8-5-8-8-5 8-5 5-8z" fill="#FFFFFF"/>
    </g>
</svg>
